name: Deploy collaboration Edge functions (production)

# Production deploy of the three collaboration Edge functions.
# Manual only: never runs on push. The operator must type "deploy" to proceed.
# Required repository secrets (added by the project owner at switch time):
#   SUPABASE_ACCESS_TOKEN  - Supabase personal access token (Account → Access Tokens)
#   SUPABASE_PROJECT_REF   - Project Settings → General → Reference ID
# Optional repository variable:
#   COLLAB_ALLOWED_ORIGINS - exact Web origins, comma separated, no trailing "/"
# SQL migrations are NOT applied here; they are pasted into the SQL Editor by the owner.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "deploy" to deploy to the production Supabase project'
        required: true
        default: ""
      set_allowed_origins:
        description: "Also update the COLLAB_ALLOWED_ORIGINS function secret from the repository variable"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: supabase-edge-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      ALLOWED_ORIGINS: ${{ vars.COLLAB_ALLOWED_ORIGINS }}
    steps:
      - name: Guard
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "deploy" ]; then
            echo "Not confirmed. Type deploy to proceed." >&2; exit 1
          fi
          case "${GITHUB_REF}" in
            refs/heads/codex/ipad-release-20261002|refs/heads/main) ;;
            *) echo "Deploy only from the release branch or main (got ${GITHUB_REF})." >&2; exit 1 ;;
          esac
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ] || [ -z "${PROJECT_REF}" ]; then
            echo "Missing SUPABASE_ACCESS_TOKEN or SUPABASE_PROJECT_REF repository secret." >&2; exit 1
          fi
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Show CLI version and deploy options
        run: |
          supabase --version
          supabase functions deploy --help | head -40
      - name: Update allowed origins secret
        if: ${{ github.event.inputs.set_allowed_origins == 'true' }}
        run: |
          if [ -z "${ALLOWED_ORIGINS}" ]; then
            echo "COLLAB_ALLOWED_ORIGINS repository variable is empty; skipping." ; exit 0
          fi
          case "${ALLOWED_ORIGINS}" in
            */|*/,*) echo "Origins must not end with /" >&2; exit 1 ;;
          esac
          supabase secrets set "COLLAB_ALLOWED_ORIGINS=${ALLOWED_ORIGINS}" --project-ref "${PROJECT_REF}"
      - name: Deploy functions
        # The functions verify the user's bearer token themselves (see docs/COLLAB_V2_SERVER.md),
        # so the gateway JWT check is disabled; the anon key alone cannot change data.
        run: |
          for fn in collab-ingest collab-maintenance collab-restore; do
            echo "Deploying ${fn}"
            supabase functions deploy "${fn}" --project-ref "${PROJECT_REF}" --no-verify-jwt
          done
      - name: List deployed functions
        run: supabase functions list --project-ref "${PROJECT_REF}"
