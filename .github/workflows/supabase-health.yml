name: Check Supabase health

on:
  workflow_dispatch:
  schedule:
    - cron: "17 0 */3 * *"

permissions:
  contents: read

jobs:
  cloud-check:
    name: Verify database and RPC availability
    runs-on: ubuntu-latest
    environment: ios-testflight
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check Supabase project
        env:
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
        run: npm run cloud:check
